# Docker-specific configuration for backend service
spring.application.name=distributed-rate-limiter

# Use PORT env var (Render, Heroku, Railway, Fly.io, etc.) with fallback to 8080
server.port=${PORT:8080}

# Graceful shutdown configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Rate Limiter Configuration (same as default)
ratelimiter.capacity=10
ratelimiter.refillRate=2
ratelimiter.cleanupIntervalMs=60000

# Disable Redis for Render (no Redis addon by default) - uses in-memory fallback
ratelimiter.redis.enabled=false

# Health check configuration
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics
management.health.redis.enabled=false

# CORS for Render domains - allow frontend to call backend
# In production, set FRONTEND_URL env var to your frontend Render URL
# Example: ratelimiter.cors.allowed-origin-patterns=https://your-frontend.onrender.com
ratelimiter.cors.allowed-origin-patterns=https://*.onrender.com,https://*.render.com,https://*.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080

# Standard Spring Boot CORS for Spring Web MVC (covers /api/**, /admin/**, etc.)
spring.web.mvc.cors.allowed-origin-patterns=https://*.onrender.com,https://*.render.com,https://*.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080
spring.web.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.mvc.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,X-Api-Key
spring.web.mvc.cors.exposed-headers=X-Correlation-ID,X-Trace-ID,X-Span-ID,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset
spring.web.mvc.cors.allow-credentials=true
spring.web.mvc.cors.max-age=3600

# Logging configuration for containers
logging.level.dev.bnacar.distributedratelimiter=INFO
logging.level.org.springframework.data.redis=INFO

# API Key Configuration - enable API key validation with the provided key
ratelimiter.security.api-keys.enabled=true
